# The iOS/iPadOS app: a thin Xcode target, the loader in main.m, around the
# two titles' frameworks, which ios/build.sh links from CMake's libmw2_ios.a
# (see ios/README.md). Generate the project with
# ios/build.sh, or `xcodegen generate --spec ios/project.yml` with MW2_IOS_TEAM
# MW2_IOS_APP_ID, MW2_IOS_DISPLAY_NAME and MW2_IOS_FRAMEWORKS set.
name: MW2
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: MW2
    PRODUCT_BUNDLE_IDENTIFIER: ${MW2_IOS_APP_ID}
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "2"
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: ${MW2_IOS_TEAM}
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: MW2.entitlements
    ENABLE_BITCODE: NO
targets:
  MW2:
    type: application
    platform: iOS
    scheme: {}
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: main.m
      # Assets.xcassets, or LocalAssets.xcassets with an icon of your own
      # (git-ignored).
      - path: ${MW2_IOS_ASSETS}
    dependencies:
      # The launcher's and the titles' SDL.
      - framework: ${MW2_IOS_FRAMEWORKS}/SDL3.framework
        embed: true
      # Loaded by main.m, one of the two, so linked by neither.
      - framework: ${MW2_IOS_FRAMEWORKS}/MW2SP.framework
        embed: true
        link: false
      - framework: ${MW2_IOS_FRAMEWORKS}/MW2MP.framework
        embed: true
        link: false
      - sdk: Foundation.framework
      - sdk: UIKit.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ${MW2_IOS_DISPLAY_NAME}
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Game Mode (iPadOS 18+): CPU/GPU priority and lower controller latency.
        LSApplicationCategoryType: public.app-category.games
        GCSupportsGameMode: true
        LSSupportsGameMode: true
        # The installed game, saves, settings and logs live in Documents, which
        # the Files app shows under the app's name.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: false
        # Not true: iPadOS then also hands the controller to UIKit as presses
        # for its own navigation, which SDL reports as arrow, Return and
        # Escape keys -- every button arrived twice (runtime/kernel/input.cpp).
        GCSupportsControllerUserInteraction: false
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        CADisableMinimumFrameDurationOnPhone: true
        # System link between iPads (ONLINE=lan) asks for the local network.
        NSLocalNetworkUsageDescription: Finds other players' games on this network for system link.
