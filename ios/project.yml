# The iOS/iPadOS app: a thin Xcode target around libmw2_ios.a, which CMake
# builds (ios/build.sh; see ios/README.md). Generate the project with
# ios/build.sh, or `xcodegen generate --spec ios/project.yml` with MW2_IOS_TEAM
# MW2_IOS_APP_ID, MW2_IOS_DISPLAY_NAME and MW2_IOS_TITLE set.
name: MW2
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: MW2
    PRODUCT_BUNDLE_IDENTIFIER: ${MW2_IOS_APP_ID}
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "2"
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: ${MW2_IOS_TEAM}
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: MW2.entitlements
    ENABLE_BITCODE: NO
    # CMake's merged archive for each SDK (ios/build.sh).
    MW2_ARCHIVE[sdk=iphoneos*]: $(PROJECT_DIR)/../build-ios-${MW2_IOS_TITLE}/ios/libmw2_ios.a
    MW2_ARCHIVE[sdk=iphonesimulator*]: $(PROJECT_DIR)/../build-iossim-${MW2_IOS_TITLE}/ios/libmw2_ios.a
    OTHER_LDFLAGS: $(MW2_ARCHIVE) -lc++ -liconv
targets:
  MW2:
    type: application
    platform: iOS
    scheme: {}
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: main.m
      # Assets.xcassets, or LocalAssets.xcassets with an icon of your own
      # (git-ignored).
      - path: ${MW2_IOS_ASSETS}
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: CoreAudio.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreMedia.framework
      - sdk: CoreMotion.framework
      - sdk: CoreVideo.framework
      - sdk: Foundation.framework
      - sdk: GameController.framework
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ${MW2_IOS_DISPLAY_NAME}
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Game Mode (iPadOS 18+): CPU/GPU priority and lower controller latency.
        LSApplicationCategoryType: public.app-category.games
        GCSupportsGameMode: true
        LSSupportsGameMode: true
        # The installed game, saves, settings and logs live in Documents, which
        # the Files app shows under the app's name.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: false
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        CADisableMinimumFrameDurationOnPhone: true
        # System link between iPads (ONLINE=lan) asks for the local network.
        NSLocalNetworkUsageDescription: Finds other players' games on this network for system link.
